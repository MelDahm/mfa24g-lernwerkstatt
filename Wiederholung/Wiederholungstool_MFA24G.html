<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wiederholungstool MFA24G</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', system-ui, sans-serif; background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); color: #e2e8f0; min-height: 100vh; display: flex; justify-content: center; padding: 16px; }
.app { max-width: 960px; width: 100%; }
.hidden { display: none !important; }

/* HEADER */
.header { display: flex; justify-content: space-between; align-items: center; padding: 16px 0; flex-wrap: wrap; gap: 10px; }
.header h1 { font-size: 24px; font-weight: 800; background: linear-gradient(135deg, #60a5fa, #a78bfa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.header .sub { font-size: 13px; color: #94a3b8; }
.header-actions { display: flex; gap: 8px; flex-wrap: wrap; }

.btn { padding: 10px 20px; border: none; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; gap: 6px; }
.btn-primary { background: linear-gradient(135deg, #3b82f6, #6366f1); color: #fff; }
.btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 15px rgba(59,130,246,0.4); }
.btn-secondary { background: #334155; color: #e2e8f0; }
.btn-secondary:hover { background: #475569; }
.btn-success { background: linear-gradient(135deg, #10b981, #059669); color: #fff; }
.btn-success:hover { transform: translateY(-1px); box-shadow: 0 4px 15px rgba(16,185,129,0.4); }
.btn-danger { background: linear-gradient(135deg, #ef4444, #dc2626); color: #fff; }
.btn-danger:hover { transform: translateY(-1px); box-shadow: 0 4px 15px rgba(239,68,68,0.4); }
.btn-ghost { background: transparent; color: #94a3b8; border: 1px solid #334155; }
.btn-ghost:hover { background: #334155; color: #e2e8f0; }
.btn-sm { padding: 6px 14px; font-size: 12px; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none !important; }

/* CARDS */
.card { background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 20px; margin-bottom: 16px; }
.card-header { font-size: 16px; font-weight: 700; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }

/* DASHBOARD */
.hero { text-align: center; padding: 40px 20px; }
.hero h2 { font-size: 28px; font-weight: 800; margin-bottom: 8px; }
.hero p { color: #94a3b8; max-width: 500px; margin: 0 auto 24px; }
.hero-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

.lernfeld-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; margin-bottom: 20px; }
.lernfeld-card { background: #1e293b; border: 1px solid #334155; border-radius: 14px; padding: 18px; cursor: pointer; transition: all 0.3s; position: relative; overflow: hidden; }
.lernfeld-card:hover { border-color: #3b82f6; transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0,0,0,0.3); }
.lernfeld-card .icon { font-size: 28px; margin-bottom: 8px; }
.lernfeld-card .name { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
.lernfeld-card .desc { font-size: 12px; color: #94a3b8; margin-bottom: 8px; }
.lernfeld-card .stats { display: flex; gap: 10px; font-size: 11px; color: #64748b; }
.lernfeld-card .stats span { display: flex; align-items: center; gap: 3px; }
.lernfeld-card .progress-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.lernfeld-card .progress-dot.green { background: #10b981; }
.lernfeld-card .progress-dot.yellow { background: #f59e0b; }
.lernfeld-card .progress-dot.gray { background: #475569; }

/* PROGRESS */
.progress-bar-wrap { height: 6px; background: #334155; border-radius: 3px; overflow: hidden; margin: 8px 0; }
.progress-bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s; background: linear-gradient(90deg, #3b82f6, #a78bfa); }

/* QUIZ */
.quiz-area { animation: fadeIn 0.3s; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
.question-text { font-size: 18px; font-weight: 600; margin-bottom: 16px; line-height: 1.5; }
.question-meta { font-size: 12px; color: #64748b; margin-bottom: 12px; display: flex; gap: 12px; flex-wrap: wrap; }
.question-meta .tag { background: #334155; padding: 2px 10px; border-radius: 20px; }
.options { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
.option { padding: 14px 18px; border: 2px solid #334155; border-radius: 12px; cursor: pointer; transition: all 0.2s; background: #0f172a; font-size: 15px; }
.option:hover { border-color: #6366f1; background: #1a2332; }
.option.selected { border-color: #3b82f6; background: #1e3a5f; }
.option.correct { border-color: #10b981; background: #064e3b; }
.option.wrong { border-color: #ef4444; background: #450a0a; }
.option.reveal-correct { border-color: #10b981; background: #064e3b; opacity: 0.7; }
.option .check { float: right; }
.feedback-box { padding: 14px; border-radius: 12px; margin-bottom: 12px; font-size: 14px; line-height: 1.5; display: none; }
.feedback-box.show { display: block; }
.feedback-box.correct { background: #064e3b; border-left: 4px solid #10b981; color: #a7f3d0; }
.feedback-box.wrong { background: #450a0a; border-left: 4px solid #ef4444; color: #fca5a5; }

/* FLASHCARDS */
.flashcard { perspective: 1000px; margin: 20px 0; min-height: 200px; }
.flashcard-inner { position: relative; width: 100%; min-height: 220px; transition: transform 0.6s; transform-style: preserve-3d; cursor: pointer; }
.flashcard.flipped .flashcard-inner { transform: rotateY(180deg); }
.flashcard-front, .flashcard-back { position: absolute; top: 0; left: 0; width: 100%; min-height: 220px; backface-visibility: hidden; border-radius: 16px; padding: 30px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
.flashcard-front { background: linear-gradient(135deg, #1e3a5f, #312e81); border: 1px solid #3b82f6; }
.flashcard-back { background: linear-gradient(135deg, #064e3b, #065f46); border: 1px solid #10b981; transform: rotateY(180deg); }
.flashcard-front .label { font-size: 12px; color: #93c5fd; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 12px; }
.flashcard-front .text { font-size: 18px; font-weight: 600; }
.flashcard-back .text { font-size: 18px; font-weight: 600; margin-bottom: 8px; }
.flashcard-back .explanation { font-size: 14px; color: #a7f3d0; max-width: 400px; }
.flashcard-hint { text-align: center; font-size: 12px; color: #64748b; margin-top: -12px; margin-bottom: 12px; }

/* TIMER */
.timer-display { text-align: center; font-size: 48px; font-weight: 800; font-variant-numeric: tabular-nums; margin: 10px 0; }
.timer-display.urgent { color: #ef4444; animation: pulse 0.5s infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

/* FOLDER BROWSER */
.folder-tree { font-size: 14px; }
.folder-tree .folder { margin: 4px 0; }
.folder-tree .folder-label { padding: 6px 10px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: 0.2s; }
.folder-tree .folder-label:hover { background: #334155; }
.folder-tree .folder-children { padding-left: 24px; display: none; }
.folder-tree .folder.open > .folder-children { display: block; }
.folder-tree .file { padding: 4px 10px 4px 32px; color: #94a3b8; font-size: 13px; display: flex; align-items: center; gap: 6px; }
.folder-tree .file:hover { color: #e2e8f0; }

/* MATCHING GAME */
.match-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 16px 0; }
.match-item { padding: 12px 16px; border: 2px solid #334155; border-radius: 10px; cursor: pointer; text-align: center; transition: all 0.2s; font-size: 14px; background: #0f172a; }
.match-item:hover { border-color: #6366f1; }
.match-item.selected { border-color: #f59e0b; background: #451a03; }
.match-item.matched { border-color: #10b981; background: #064e3b; cursor: default; }

/* TABS */
.tabs { display: flex; gap: 4px; margin-bottom: 16px; flex-wrap: wrap; }
.tab { padding: 8px 18px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600; transition: 0.2s; background: #334155; color: #94a3b8; border: none; }
.tab:hover { background: #475569; color: #e2e8f0; }
.tab.active { background: #3b82f6; color: #fff; }

/* RESULTS */
.result-screen { text-align: center; padding: 30px 20px; }
.result-screen .big-num { font-size: 64px; font-weight: 800; background: linear-gradient(135deg, #60a5fa, #a78bfa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.result-screen .sub-text { font-size: 16px; color: #94a3b8; margin: 8px 0 20px; }
.result-screen .detail-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin: 16px 0; }
.result-screen .detail-item { background: #334155; padding: 14px; border-radius: 10px; }
.result-screen .detail-item .num { font-size: 24px; font-weight: 700; }
.result-screen .detail-item .lbl { font-size: 12px; color: #94a3b8; }

/* SCORE STARS */
.stars { font-size: 32px; letter-spacing: 4px; margin: 8px 0; }

/* RESPONSIVE */
@media (max-width: 640px) {
  .lernfeld-grid { grid-template-columns: 1fr; }
  .match-grid { grid-template-columns: 1fr; }
  .timer-display { font-size: 36px; }
  .hero h2 { font-size: 22px; }
  .flashcard-front, .flashcard-back { padding: 20px; }
}

/* SCROLLBAR */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: #0f172a; }
::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }

/* ACHIEVEMENT POPUP */
.achievement { position: fixed; top: 20px; right: 20px; background: linear-gradient(135deg, #1e3a5f, #312e81); border: 1px solid #3b82f6; border-radius: 14px; padding: 16px 20px; z-index: 100; box-shadow: 0 10px 40px rgba(0,0,0,0.5); animation: slideIn 0.4s; max-width: 320px; }
@keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
.achievement .title { font-size: 14px; font-weight: 700; }
.achievement .desc { font-size: 12px; color: #93c5fd; }
</style>
</head>

function waehleQuiz(idx) {
  if (state.beantwortet) return;

  const opts = document.querySelectorAll('.option');

function startZeitrennen() {
  state.isTimed = true;
  state.gemischteFragen = [];
  Object.keys(FRAGEN).forEach(key => {
    (FRAGEN[key] || []).forEach(q => state.gemischteFragen.push({ ...q, lernfeld: key }));
  });
  for (let i = state.gemischteFragen.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [state.gemischteFragen[i], state.gemischteFragen[j]] = [state.gemischteFragen[j], state.gemischteFragen[i]];
  }
  state.frageIdx = 0;
  state.punkte = 0;
  state.beantwortet = false;
  state.gesamt = state.gemischteFragen.length;
  state.verbleibend = 120;
  state.modus = 'zeitrennen';
  state.screen = 'zeitrennen';
  state.startZeit = Date.now();
  render();
  startTimer();
}

function startZeitrennenLf(id) {
  state.lernfeld = id;
  state.isTimed = true;
  state.gemischteFragen = (FRAGEN[id] || []).map(q => ({ ...q, lernfeld: id }));
  for (let i = state.gemischteFragen.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [state.gemischteFragen[i], state.gemischteFragen[j]] = [state.gemischteFragen[j], state.gemischteFragen[i]];
  }
  state.frageIdx = 0;
  state.punkte = 0;
  state.beantwortet = false;
  state.gesamt = state.gemischteFragen.length;
  state.verbleibend = 60;
  state.modus = 'zeitrennen';
  state.screen = 'zeitrennen';
  state.startZeit = Date.now();
  render();
  startTimer();
}

function startTimer() {
  if (state.timerInterval) clearInterval(state.timerInterval);
  state.timerInterval = setInterval(() => {
    state.verbleibend--;
    const el = document.getElementById('timerDisplay');
    if (el) {
      const m = Math.floor(state.verbleibend / 60);
      const s = state.verbleibend % 60;
      el.textContent = `${m}:${s.toString().padStart(2,'0')}`;
      el.className = 'timer-display' + (state.verbleibend <= 15 ? ' urgent' : '');
    }
    if (state.verbleibend <= 0) {
      clearInterval(state.timerInterval);
      state.timerInterval = null;
      showErgebnis();
    }
  }, 1000);
}

function renderZeitrennen() {
  if (state.frageIdx >= state.gemischteFragen.length) { showErgebnis(); return; }
  const q = state.gemischteFragen[state.frageIdx];
  const lf = LERNFELDER.find(l => l.id === q.lernfeld);

  app.innerHTML = `

// ====================================================================
// ZUORDNUNGSSPIEL
// ====================================================================
function startZuordnung(id) {
  const pairs = ZUORDNUNGEN[id];
  if (!pairs) return;
  state.lernfeld = id;
  state.matchPairs = [...pairs];
  state.matchGelöst = 0;
  state.matchSelected = null;
  state.matchedIndices = [];
  const shufLeft = [...pairs];
  for (let i = shufLeft.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [shufLeft[i], shufLeft[j]] = [shufLeft[j], shufLeft[i]];
  }
  state.matchLeft = shufLeft.map(p => p.left);
  const shufRight = [...pairs];
  for (let i = shufRight.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [shufRight[i], shufRight[j]] = [shufRight[j], shufRight[i]];
  }
  state.matchRight = shufRight.map(p => p.right);
  state.modus = 'zuordnung';
  state.screen = 'zuordnung';
  render();
}

function renderZuordnung() {
  const lf = LERNFELDER.find(l => l.id === state.lernfeld);
  const gelöst = state.matchGelöst;
  const total = state.matchPairs.length;

  app.innerHTML = `
    <div class="header">

      <div class="header-actions">

      </div>
    </div>
    ${gelöst === total ? `
      <div class="card" style="text-align:center;padding:30px;">
        <div style="font-size:48px;">🎉</div>
        <div style="font-size:20px;font-weight:700;margin:8px 0;">Alle ${total} Paare gefunden!</div>
        <button class="btn btn-primary" onclick="startZuordnung('${state.lernfeld}')">🔄 Noch einmal</button>
      </div>
    ` : `
    <div style="font-size:13px;color:#94a3b8;text-align:center;margin-bottom:8px;">
      🔗 ${gelöst}/${total} Paare gefunden · Klicke je einen Begriff links und rechts
    </div>
    <div class="match-grid">
      <div>
        ${state.matchLeft.map((item, i) => {
          const pi = state.matchPairs.findIndex(p => p.left === item);
          const isMatched = state.matchedIndices.includes(pi);
          const isSelected = state.matchSelected === ('l'+i);
          return `<div class="match-item ${isMatched?'matched':''} ${isSelected?'selected':''}" onclick="matchClick('l',${i})">${item}</div>`;
        }).join('')}
      </div>
      <div>
        ${state.matchRight.map((item, i) => {
          const pi = state.matchPairs.findIndex(p => p.right === item);
          const isMatched = state.matchedIndices.includes(pi);
          const isSelected = state.matchSelected === ('r'+i);
          return `<div class="match-item ${isMatched?'matched':''} ${isSelected?'selected':''}" onclick="matchClick('r',${i})">${item}</div>`;
        }).join('')}
      </div>
    </div>
    `}
  `;
}

function matchClick(side, idx) {
  const pi = side === 'l'
    ? state.matchPairs.findIndex(p => p.left === state.matchLeft[idx])
    : state.matchPairs.findIndex(p => p.right === state.matchRight[idx]);
  if (state.matchedIndices.includes(pi)) return;
  const key = side + idx;
  if (state.matchSelected === null) {
    state.matchSelected = key;
    render();
    return;
  }
  if (state.matchSelected === key) {
    state.matchSelected = null;
    render();
    return;
  }
  const prevSide = state.matchSelected[0];
  const prevIdx = parseInt(state.matchSelected.slice(1));
  let leftIdx, rightIdx;
  if (prevSide === 'l') { leftIdx = prevIdx; rightIdx = idx; }
  else { leftIdx = idx; rightIdx = prevIdx; }
  const pairIdx = state.matchPairs.findIndex(p => p.left === state.matchLeft[leftIdx] && p.right === state.matchRight[rightIdx]);
  if (pairIdx >= 0 && !state.matchedIndices.includes(pairIdx)) {
    state.matchedIndices.push(pairIdx);
    state.matchGelöst++;
  }
  state.matchSelected = null;
  render();
}

// TAGESFRAGE
// ====================================================================
function startTagesfrage() {
  const all = [];
  Object.keys(FRAGEN).forEach(key => {
    (FRAGEN[key] || []).forEach(q => all.push({ ...q, lernfeld: key }));
  });
  const today = new Date().toDateString();
  const seed = today.split('').reduce((a,c) => a + c.charCodeAt(0), 0);
  const idx = seed % all.length;
  state.tagesfrage = all[idx];
  state.screen = 'tagesfrage';
  state.beantwortet = false;
  render();
}

function renderTagesfrage() {
  const q = state.tagesfrage;
  if (!q) { state.screen = 'dashboard'; render(); return; }
  const lf = LERNFELDER.find(l => l.id === q.lernfeld);

  app.innerHTML = `
    <div class="header">
      <div><h1>🎯 Frage des Tages</h1></div>
      <div class="header-actions">
        <button class="btn btn-ghost btn-sm" onclick="state.screen='dashboard'; render();">← Zurück</button>
      </div>
    </div>
    <div class="card" style="text-align:center;">
      <div style="font-size:14px;color:#94a3b8;">${lf.icon} ${lf.name}</div>
      <div class="question-text" style="margin-top:12px;">${q.f}</div>
      <div class="options" id="options" style="max-width:500px;margin:0 auto;">
        ${q.a.map((a,i) => `<div class="option" data-idx="${i}" onclick="waehleTagesfrage(${i})">${a}</div>`).join('')}
      </div>
      <div class="feedback-box" id="feedback" style="max-width:500px;margin:10px auto;"></div>
    </div>
  `;
}

function renderTagesfragePreview(lfId) {
  const all = [];
  Object.keys(FRAGEN).forEach(key => {
    (FRAGEN[key] || []).forEach(q => all.push({ ...q, lernfeld: key }));
  });
  const today = new Date().toDateString();
  const seed = today.split('').reduce((a,c) => a + c.charCodeAt(0), 0);
  const idx = seed % all.length;
  const q = all[idx];
  const lf = LERNFELDER.find(l => l.id === q.lernfeld);
  if (q.lernfeld !== lfId) return `<div style="font-size:13px;color:#94a3b8;">Heute: Frage aus ${lf.icon} ${lf.name} · <button class="btn btn-sm btn-primary" onclick="startTagesfrage(); state.screen='tagesfrage'; render();">Anzeigen</button></div>`;
  return `<div style="font-size:13px;">${q.f}<br><button class="btn btn-sm btn-primary" style="margin-top:8px;" onclick="startTagesfrage(); state.screen='tagesfrage'; render();">Beantworten</button></div>`;
}

function waehleTagesfrage(idx) {
  if (state.beantwortet) return;
  state.beantwortet = true;
  const q = state.tagesfrage;
  const opts = document.querySelectorAll('#options .option');
  const fb = document.getElementById('feedback');
  state.statistik.gespielt++;
  if (idx === q.r) {
    opts[idx].classList.add('correct');
    state.statistik.richtig++;
    state.statistik.serie++;
    if (state.statistik.serie > state.statistik.maxSerie) state.statistik.maxSerie = state.statistik.serie;
    fb.className = 'feedback-box correct show';
    fb.innerHTML = `✅ Richtig! ${q.e}`;
  } else {
    opts[idx].classList.add('wrong');
    opts[q.r].classList.add('reveal-correct');
    state.statistik.falsch++;
    state.statistik.serie = 0;
    fb.className = 'feedback-box wrong show';
    fb.innerHTML = `❌ <strong>Richtig:</strong> ${q.a[q.r]}<br>💡 ${q.e}`;
  }
  saveErgebnisse();
}

function showErgebnis() {
  const richtig = state.punkte;
  const gesamt = state.gesamt;
  const pct = gesamt > 0 ? Math.round(richtig / gesamt * 100) : 0;
  let note = 'Nachbesserung';
  let farbe = '#ef4444';
  let stars = '⭐';
  if (pct >= 92) { note = 'Sehr gut'; farbe = '#10b981'; stars = '⭐⭐⭐⭐⭐'; }
  else if (pct >= 81) { note = 'Gut'; farbe = '#22c55e'; stars = '⭐⭐⭐⭐'; }
  else if (pct >= 67) { note = 'Befriedigend'; farbe = '#f59e0b'; stars = '⭐⭐⭐'; }
  else if (pct >= 50) { note = 'Ausreichend'; farbe = '#f97316'; stars = '⭐⭐'; }
  else stars = '⭐';

  // Save lernfeld ergebnisse
  const lfId = state.lernfeld || 'all';
  if (!state.ergebnisse[lfId]) state.ergebnisse[lfId] = { richtig: 0, gesamt: 0, gespielt: 0 };
  if (state.modus !== 'zeitrennen') {
    state.ergebnisse[lfId].richtig = Math.max(state.ergebnisse[lfId].richtig || 0, richtig);
    state.ergebnisse[lfId].gesamt = Math.max(state.ergebnisse[lfId].gesamt || 0, gesamt);
  }
  state.ergebnisse[lfId].gespielt = (state.ergebnisse[lfId].gespielt || 0) + 1;
  saveErgebnisse();

  const lf = state.lernfeld ? LERNFELDER.find(l => l.id === state.lernfeld) : null;
  const zeit = state.startZeit ? Math.round((Date.now() - state.startZeit) / 1000) : 0;

  state.screen = 'ergebnis';
  app.innerHTML = `
    <div class="header">
      <div><h1>📊 Ergebnis</h1></div>
      <div class="header-actions">
        <button class="btn btn-ghost btn-sm" onclick="state.screen='dashboard'; render();">← Dashboard</button>
      </div>
    </div>
    <div class="card result-screen">
      <div class="stars">${stars}</div>
      <div class="big-num">${richtig}/${gesamt}</div>
      <div style="font-size:24px;font-weight:700;color:${farbe};">${pct}% · ${note}</div>
      <div class="detail-grid">
        <div class="detail-item"><div class="num">${richtig}</div><div class="lbl">Richtig</div></div>
        <div class="detail-item"><div class="num">${gesamt - richtig}</div><div class="lbl">Falsch</div></div>
        <div class="detail-item"><div class="num">${pct}%</div><div class="lbl">Quote</div></div>
        ${zeit > 0 ? `<div class="detail-item"><div class="num">${zeit}s</div><div class="lbl">Zeit</div></div>` : ''}
      </div>
      <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">
        ${lf ? `<button class="btn btn-primary" onclick="startQuiz('${lf.id}')">📝 Quiz wiederholen</button>` : ''}
        ${lf ? `<button class="btn btn-secondary" onclick="startKarteikarten('${lf.id}')">🃏 Karteikarten</button>` : ''}
        <button class="btn btn-secondary" onclick="state.screen='dashboard'; render();">🏠 Dashboard</button>
      </div>
    </div>
  `;
}
